# =====================================================================
# Configuración Principal — ms-clientes (Microservicio Autónomo)
# =====================================================================
spring.application.name=ms-clientes
server.port=${PORT:8081}

# Conexión MySQL parametrizada mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_techservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Formato JSON estándar
spring.jackson.serialization.indent-output=true
