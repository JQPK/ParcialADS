# =====================================================================
# Configuración Principal — api-techservices
# =====================================================================
spring.application.name=api-techservices
server.port=${PORT:8080}

# Conexión MySQL parametrizada mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_techservices?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Formato JSON estándar
spring.jackson.serialization.indent-output=true
