services:
  # =====================================================================
  # Servicio 1: API REST Segura (Ejercicio 1)
  # =====================================================================
  - type: web
    name: api-techservices
    env: java
    plan: free
    rootDir: api-techservices
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/api-techservices-1.0.0.jar
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # =====================================================================
  # Servicio 2: Microservicio Autónomo de Clientes (Ejercicio 2)
  # =====================================================================
  - type: web
    name: ms-clientes
    env: java
    plan: free
    rootDir: ms-clientes
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/ms-clientes-1.0.0.jar
    envVars:
      - key: PORT
        value: 8081
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
